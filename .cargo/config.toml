# Every process `cargo` launches (a `cargo test` binary, and
# anything that binary spawns via `Command::new(env!("CARGO_BIN_EXE_crewd"))`,
# since a spawned child inherits its parent's environment by default) gets
# this set. `crewd serve` reads it exactly once, at startup
# (`crates/runtime/src/lifecycle.rs`), and forces every pane it would
# otherwise create onto the `Hidden` display backend regardless of
# `display.backend` config -- so the test suite can never open a real herdr
# pane or OS window, without any test needing to know this variable exists.
#
# A `crewd` binary NOT launched by `cargo` (a prebuilt `./target/debug/crewd`
# run by hand, or the one the OMP extension spawns) inherits nothing here and
# behaves exactly as configured -- this is a test-environment safeguard, not
# a product default. Cargo does not override an already-exported value of
# the same name (the default, since `force` is omitted below), so an
# operator who explicitly sets this in their own shell -- e.g. to keep a
# headless host's `crewd serve --foreground` display-less -- is respected,
# not fought.
[env]
CREW_FORCE_HIDDEN_DISPLAYS = "1"

# The same safeguard for vendor CLIs. Unset, the runtime treats them as
# ordinary installed dependencies: the availability probe and the
# conformance suites spawn the real binary if one is on PATH. That is the
# correct production default and the wrong test default -- it made a
# conformance baseline pass against a live `claude --version` on a machine
# that happened to have it installed, and report four failures on one that
# did not, with the difference invisible in the output. Every job in
# `ci.yml` sets this, and every local run was supposed to; "was supposed
# to" is what this line replaces.
#
# Only the exact value "1" disables (see `vendor_cli_invocation_disabled`
# in crates/runtime/src/conformance/mod.rs). A deliberate live run turns it
# off by value rather than by unsetting it, because `[env]` means it is
# never absent under cargo:
#
#     CREW_DISABLE_VENDOR_CLI=0 CREW_LIVE_CWD=/path/to/trusted/project \
#       cargo test --test conformance
#
# `force` is omitted above and here, so an exported value always wins over
# these -- that override is what makes a live run possible, and it is a
# visible, deliberate act on the command line rather than an ambient
# condition of the shell.
CREW_DISABLE_VENDOR_CLI = "1"
