name: Dry-Run Release Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read release/targets.json
        run: |
          MATRIX=$(jq -c '{include: [.targets[] | {os, rust_target: .rust, leaf_target: .leaf}]}' release/targets.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux ARM64 cross-compiler
        if: matrix.leaf_target == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # The apt package installs fine, but it provides no binary named
          # `gcc-aarch64-linux-gnu` -- the executable is
          # `aarch64-linux-gnu-gcc`, the name the release.yml arm64 leg uses.
          # The old wording made rustc fail at the link step with
          # "linker `gcc-aarch64-linux-gnu` not found" on every push.
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Build crewd
        run: cargo build --release --target ${{ matrix.rust_target }} --bin crewd

      - name: Assemble leaf package
        run: |
          cargo run -p batman-xtask -- package \
            --target ${{ matrix.leaf_target }} \
            --binary target/${{ matrix.rust_target }}/release/crewd
