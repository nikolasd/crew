# Produces the committed extension bundle in CI's exact environment
# (ubuntu-latest + pinned Bun). The bundle embeds Bun's platform-specific
# module shim, so a byte-exact rebuild is only possible on linux-x64 --
# the platform `bundle-check` verifies against. Run this workflow, download
# the `dist-linux-x64` artifact, and commit it to refresh the bundle.
# See CI-FAILS.md and the bundle-check job in ci.yml.
name: refresh-bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS workspace dependencies
        run: bun install

      - name: Rebuild the extension bundle
        run: bun run build

      - name: Record checksum
        run: sha256sum packages/extension/dist/index.js

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: packages/extension/dist/index.js
