name: Build and Publish Release Assets

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (e.g. v0.4.0). Only a v* tag triggers the release job."
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Fails fast on a mismatched tag before any build or conformance work. It also
  # decides whether this run publishes a release:
  #   - a tag push always publishes;
  #   - a workflow_dispatch run publishes iff its `ref` input is a v* release tag
  #     whose name matches the checked-out version; a branch ref is a dry run.
  # It outputs the effective tag so the `release` job can create and upload it.
  version-gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      is_tag: ${{ steps.read.outputs.is_tag }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - id: read
        name: Read the release version and decide if this is a tag release
        run: |
          VERSION=$(jq -r .version packages/extension/package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "packages/extension/package.json has no version" >&2
            exit 1
          fi
          # The ref we are releasing from: the dispatcher's input on a manual
          # run, otherwise the pushed ref (always a tag, given the trigger above).
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${{ github.ref_name }}"
          fi
          # A run is a tag release if it is a tag push, or a dispatch whose ref is
          # a v* release tag. A branch ref (e.g. main or v2-dev) is a dry run.
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          IS_TAG="false"
          TAG=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [[ "$REF" =~ $TAG_RE ]]; then
            IS_TAG="true"
            TAG="$REF"
          fi
          if [ "$IS_TAG" = "true" ] && [ "$REF" != "v${VERSION}" ]; then
            echo "tag ${REF} does not match packages/extension/package.json version ${VERSION} (expected v${VERSION})" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # `release/targets.json` is the single source of truth for the target set.
  # The matrix is derived from it so a target can never be added here and
  # forgotten in xtask (or the reverse).
  targets:
    needs: version-gate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - id: read
        name: Read release/targets.json
        run: |
          MATRIX=$(jq -c '{include: [.targets[] | {os, rust_target: .rust, leaf_target: .leaf}]}' release/targets.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: [version-gate, targets]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux ARM64 cross-compiler
        if: matrix.leaf_target == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Build crewd
        run: cargo build --release --target ${{ matrix.rust_target }} --bin crewd

      # Pin the packaging clock to the tagged commit's own commit time, so a
      # rebuild of the same commit produces a byte-identical manifest.
      - name: Resolve SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Assemble leaf package
        run: |
          cargo run -p batman-xtask -- package \
            --target ${{ matrix.leaf_target }} \
            --binary target/${{ matrix.rust_target }}/release/crewd

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          file: packages/crew-${{ matrix.leaf_target }}/bin/crewd
          artifact-name: sbom-${{ matrix.leaf_target }}.spdx.json


      - name: Upload leaf package
        uses: actions/upload-artifact@v4
        with:
          name: crew-${{ matrix.leaf_target }}
          path: packages/crew-${{ matrix.leaf_target }}/

  conformance:
    needs: build
    runs-on: ubuntu-latest
    # The runtime's default posture is that vendor CLIs are ordinary
    # installed dependencies: live conformance and the availability probe
    # run by default and will spawn a real, billed vendor CLI process if
    # one happens to be on PATH. This job must never make a billed call, so
    # it sets the opt-out kill switch (see
    # `crates/runtime/src/conformance/mod.rs`). This gate uses fixture mode
    # only regardless -- the switch is a second, independent safeguard.
    env:
      CREW_DISABLE_VENDOR_CLI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS workspace dependencies
        run: bun install
      - name: Run conformance unit tests
        run: bun test tests/conformance

      # The gate needs a real `crewd`: it spawns the CLI rather than
      # hand-writing a report, which is what let the previous stub pass a
      # fabricated payload through validation.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build crewd
        run: cargo build -p batman-runtime --bin crewd

      - name: Generate conformance report
        run: bun run -e "import { runAllFixtures } from './tests/conformance/run.ts'; await runAllFixtures('conformance-report.json');"

      - name: Validate conformance report
        run: bun run -e "import { loadAndValidateReport } from './tests/conformance/assert-report.ts'; loadAndValidateReport('conformance-report.json');"

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json

  # Validates the four leaves TOGETHER -- shared version, identical schema
  # fingerprint, real checksums, an executable named `crewd` -- and emits
  # one aggregate release manifest. No single `package` run can make these
  # checks, so this is the only place a mismatched set is caught.
  package-set:
    needs: [build, version-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download all leaf packages
        uses: actions/download-artifact@v4
        with:
          pattern: crew-*
          path: assembled
      - name: Restore executable bits
        run: |
          # actions/upload-artifact zips files and download-artifact restores
          # them as 0644. package-set validates the executable bit, so we
          # must restore it before validation.
          find assembled -name crewd -exec chmod +x {} +

      - name: Read release version
        run: echo "RELEASE_VERSION=${{ needs.version-gate.outputs.version }}" >> "$GITHUB_ENV"

      - name: Validate the assembled set
        run: |
          cargo run -p batman-xtask -- package-set \
            --version "$RELEASE_VERSION" \
            --input assembled \
            --output release

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/release-manifest.json

  release:
    needs: [build, conformance, package-set, version-gate]
    runs-on: ubuntu-latest
    if: ${{ needs.version-gate.outputs.is_tag == 'true' }}
    permissions:
      # Uploading release assets needs a write-scoped token; the workflow
      # default is `contents: read`.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Download all leaf packages
        uses: actions/download-artifact@v4
        with:
          pattern: crew-*
          path: assembled

      - name: Restore executable bits
        run: |
          # actions/upload-artifact zips files and download-artifact restores
          # them as 0644; the uploaded asset must stay executable.
          find assembled -name crewd -exec chmod +x {} +

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release

      - name: Stage release assets
        # `download.ts` fetches exactly these names -- `crewd-${target}`
        # and `crewd-${target}.manifest.json` -- so this pairing is the
        # contract between the two files.
        run: |
          mkdir -p release-assets
          for leaf in $(jq -r '.targets[].leaf' release/targets.json); do
            cp "assembled/crew-$leaf/bin/crewd" "release-assets/crewd-$leaf"
            cp "assembled/crew-$leaf/manifest.json" "release-assets/crewd-$leaf.manifest.json"
          done
          cp release/release-manifest.json release-assets/release-manifest.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version-gate.outputs.tag }}
        run: |
          # The tag push that triggers this workflow does not itself create a
          # GitHub Release, so ensure one exists before uploading assets to it.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
