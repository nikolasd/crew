[workspace]
members = ["crates/fake-worker", "crates/protocol", "crates/runtime", "crates/xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
nix = { version = "0.30", features = ["fs", "process", "signal", "socket", "term", "user"] }
parking_lot = "0.12"
portable-pty = "0.8"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.129", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.49", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "11", features = ["serde-compat"] }
uuid = { version = "1", features = ["serde", "v7"] }
