# Repository-level Crew configuration.
# Precedence: higher than org, lower than user.

# Override display backend for this repo.
display:
  backend: "herdr"

# Override max workers (not locked by org, so this is allowed).
max_workers: 4

# Repository-specific model allowlist additions.
models:
  allowlist:
    - "claude-3-5-sonnet"
    - "claude-3-5-haiku"
    - "gpt-4o"
    - "gpt-4o-mini"

# Concurrency ceiling for this repo.
concurrency:
  ceiling: 2

# Rollout gates for this repo.
rollout_gates:
  vendor_terms_accepted: true
  retention_configured: true
  model_allowlist_set: true
  concurrency_explicit: true
  native_discovery_reviewed: true
  ornith_identity_set: true
