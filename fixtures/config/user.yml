# User-level Crew configuration.
# Highest static precedence (below per-run params).

# User's preferred display backend.
display:
  backend: "tmux"

# User's preferred retention (not locked by org).
retention: "30d"

# User-specific model preferences.
models:
  allowlist:
    - "claude-3-5-sonnet"
    - "claude-3-5-haiku"
    - "gpt-4o"
    - "gpt-4o-mini"
    - "gemini-2.5-pro"

# User's concurrency preference.
concurrency:
  ceiling: 3

# Rollout gates for this user.
rollout_gates:
  vendor_terms_accepted: true
  retention_configured: true
  model_allowlist_set: true
  concurrency_explicit: true
  native_discovery_reviewed: true
  ornith_identity_set: true
