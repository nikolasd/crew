# Organization-level Crew configuration.
# This is the lowest-precedence layer; fields can be locked so that
# lower-precedence layers (repo, user) cannot override them.

# Audit retention period (e.g. "30d", "90d", "1y").
retention: "90d"

# Maximum number of concurrent workers across all runs.
max_workers: 8

# Display backend preference ("auto", "herdr", "tmux", "embedded").
display:
  backend: "auto"

# Security redaction patterns (org-defined regex patterns).
security:
  patterns:
    - "AKIA[0-9A-Z]{16}"  # AWS access key ID
    - "ghp_[0-9a-zA-Z]{36}"  # GitHub personal access token
    - "sk-[0-9a-zA-Z]{48}"  # OpenAI-style secret key

# Model allowlist (empty = use adapter defaults).
models:
  allowlist:
    - "claude-3-5-sonnet"
    - "claude-3-5-haiku"
    - "gpt-4o"

# Concurrency ceiling (max concurrent runs).
concurrency:
  ceiling: 4

# Rollout gates that must be resolved before production use.
rollout_gates:
  vendor_terms_accepted: true
  retention_configured: true
  model_allowlist_set: true
  concurrency_explicit: true
  native_discovery_reviewed: true
  ornith_identity_set: false  # pending review

# Fields locked by org policy (lower layers cannot override).
locks:
  retention: true
  max_workers: true
